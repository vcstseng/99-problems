<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題地圖 — 99 Problems</title><link rel="stylesheet" href="../../assets/css/site.css"></head><body><header class="site-header site-shell"><a class="brand" href="../../index.html"><span class="brand-mark">99</span><span class="brand-copy">Problems<small>From Jobs to Real Business Problems</small></span></a><nav class="site-nav" aria-label="Primary"><a href="../../pages/problem-map/index.html" aria-current="page">問題地圖</a><a href="../../pages/methodology/index.html">方法論</a><a class="lang" href="#" data-lang-toggle>中 / EN</a></nav></header>
<main class="site-shell"><section class="page-head"><h1>問題地圖</h1><p class="subtitle" id="map-subtitle">99 個問題，一張地圖看懂</p><p class="intro" id="map-intro">從企業實務問題、AI 風險與治理，到系統性後果。選擇一個領域，再點進任何問題查看完整拆解。</p></section><section class="problem-map"><div class="map-groups" id="group-tabs"></div><div class="category-grid dynamic" id="category-grid"></div><div class="map-layout"><aside class="map-side" id="map-side"></aside><section class="problem-list" id="problem-list"></section></div></section></main>
<script src="../../data/problems.js"></script><script src="../../data/extensions.js"></script><script src="../../assets/js/site.js"></script>
<script>
(function(){
 const params=new URLSearchParams(location.search); let group=params.get('group')||'business'; let category=params.get('category')||'';
 const groups={business:{label:'企業實務問題',count:57,desc:'10 大企業領域'},ai:{label:'AI 風險與治理',count:35,desc:'5 大面向'},system:{label:'系統性後果',count:7,desc:'7 個系統效應'}};
 const cats=g=>[...new Set(PROBLEMS.filter(p=>p.group===g).map(p=>p.Category))];
 function render(){
   if(!groups[group]) group='business'; if(category && !cats(group).includes(category)) category='';
   const q=new URLSearchParams({group}); if(category) q.set('category',category); history.replaceState(null,'','?'+q.toString());
   document.getElementById('map-subtitle').textContent=`${groups[group].count} 個${groups[group].label}`;
   document.getElementById('map-intro').textContent=group==='business'?'從真實工作需求出發，整理企業日常最常見、也最值得重新思考的問題。':group==='ai'?'當 AI 開始讀資料、做判斷、記憶與採取行動，企業必須面對的新風險與治理問題。':'即使個別 AI 專案運作正常，整個人與 AI 的系統仍可能逐步出現的長期效應。';
   const tabs=document.getElementById('group-tabs'); tabs.innerHTML=''; Object.entries(groups).forEach(([k,v])=>{const b=document.createElement('button');b.className='group-tab'+(k===group?' active':'');b.innerHTML=`<strong>${v.count}</strong><span>${v.label} · ${v.desc}</span>`;b.onclick=()=>{group=k;category='';render()};tabs.appendChild(b)});
   const cg=document.getElementById('category-grid'); cg.innerHTML=''; const all=document.createElement('button');all.className='category-chip'+(!category?' active':'');all.innerHTML=`<span>全部</span><strong>${groups[group].count}</strong>`;all.onclick=()=>{category='';render()};cg.appendChild(all);
   cats(group).forEach(c=>{const items=PROBLEMS.filter(p=>p.group===group&&p.Category===c);const b=document.createElement('button');b.className='category-chip'+(category===c?' active':'');b.innerHTML=`<span>${items[0].categoryZh}</span><strong>${items.length}</strong>`;b.onclick=()=>{category=c;render()};cg.appendChild(b)});
   const side=document.getElementById('map-side');side.innerHTML='';const sa=document.createElement('a');sa.href='#';sa.className=!category?'active':'';sa.innerHTML=`全部 <span>${groups[group].count}</span>`;sa.onclick=e=>{e.preventDefault();category='';render()};side.appendChild(sa);
   cats(group).forEach(c=>{const items=PROBLEMS.filter(p=>p.group===group&&p.Category===c);const a=document.createElement('a');a.href='#';a.className=category===c?'active':'';a.innerHTML=`${items[0].categoryZh} <span>${items.length}</span>`;a.onclick=e=>{e.preventDefault();category=c;render()};side.appendChild(a)});
   const list=document.getElementById('problem-list');list.innerHTML='';PROBLEMS.filter(p=>p.group===group&&(!category||p.Category===category)).forEach(p=>{const a=document.createElement('a');a.className='problem-row';a.href=`../problems/${encodeURIComponent(p.ID)}/index.html`;a.innerHTML=`<div class="problem-id">${p.ID}<small>${p.categoryZh}</small></div><div><h3>${p['Plain Language']}</h3><p>${p['Business Problem']}</p></div><div>→</div>`;list.appendChild(a)});
 }
 render();
})();
</script></body></html>
