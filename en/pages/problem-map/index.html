<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem Map — 99 Problems</title><link rel="stylesheet" href="../../assets/css/site.css"></head><body><header class="site-header site-shell"><a class="brand" href="../../index.html"><span class="brand-mark">99</span><span class="brand-copy">Problems<small>From Jobs to Real Business Problems</small></span></a><nav class="site-nav" aria-label="Primary"><a href="../../pages/problem-map/index.html" aria-current="page">Problem Map</a><a href="../../pages/methodology/index.html">Methodology</a><a href="../practice/index.html" data-solving-practice>Practice</a> <a class="lang" href="#" data-lang-toggle>中 / EN</a></nav></header>
<main class="site-shell"><section class="page-head"><h1>Problem Map</h1><p class="subtitle" id="map-subtitle">99 problems, one map</p><p class="intro" id="map-intro">Explore business problems, AI risks and governance, and system effects. Pick a domain, then open any problem for the full breakdown.</p></section><section class="problem-map"><div class="map-groups" id="group-tabs"></div><div class="category-grid dynamic" id="category-grid"></div><div class="map-layout"><aside class="map-side" id="map-side"></aside><section class="problem-list" id="problem-list"></section></div></section></main>
<script src="../../data/problems.js"></script><script src="../../data/extensions.js"></script><script src="../../assets/js/site.js"></script>
<script>
(function(){
 const params=new URLSearchParams(location.search); let group=params.get('group')||'business'; let category=params.get('category')||'';
 const groups={business:{label:'Business Problems',count:57,desc:'10 business domains'},ai:{label:'AI Risks & Governance',count:35,desc:'5 dimensions'},system:{label:'System Effects',count:7,desc:'7 system effects'}};
 const cats=g=>[...new Set(PROBLEMS.filter(p=>p.group===g).map(p=>p.Category))];
 function render(){
   if(!groups[group]) group='business'; if(category && !cats(group).includes(category)) category='';
   const q=new URLSearchParams({group}); if(category) q.set('category',category); history.replaceState(null,'','?'+q.toString());
   document.getElementById('map-subtitle').textContent=`${groups[group].count} ${groups[group].label}`;
   document.getElementById('map-intro').textContent=group==='business'?'Business problems drawn from real work: recurring decisions, bottlenecks, and trade-offs worth rethinking.':group==='ai'?'New risks and governance problems that appear when AI can read data, make decisions, remember context, and take action.':'Longer-term effects that can emerge across the combined human + AI system even when individual components appear to work.';
   const tabs=document.getElementById('group-tabs'); tabs.innerHTML=''; Object.entries(groups).forEach(([k,v])=>{const b=document.createElement('button');b.className='group-tab'+(k===group?' active':'');b.innerHTML=`<strong>${v.count}</strong><span>${v.label} · ${v.desc}</span>`;b.onclick=()=>{group=k;category='';render()};tabs.appendChild(b)});
   const cg=document.getElementById('category-grid'); cg.innerHTML=''; const all=document.createElement('button');all.className='category-chip'+(!category?' active':'');all.innerHTML=`<span>All</span><strong>${groups[group].count}</strong>`;all.onclick=()=>{category='';render()};cg.appendChild(all);
   cats(group).forEach(c=>{const items=PROBLEMS.filter(p=>p.group===group&&p.Category===c);const b=document.createElement('button');b.className='category-chip'+(category===c?' active':'');b.innerHTML=`<span>${items[0].categoryEn}</span><strong>${items.length}</strong>`;b.onclick=()=>{category=c;render()};cg.appendChild(b)});
   const side=document.getElementById('map-side');side.innerHTML='';const sa=document.createElement('a');sa.href='#';sa.className=!category?'active':'';sa.innerHTML=`All <span>${groups[group].count}</span>`;sa.onclick=e=>{e.preventDefault();category='';render()};side.appendChild(sa);
   cats(group).forEach(c=>{const items=PROBLEMS.filter(p=>p.group===group&&p.Category===c);const a=document.createElement('a');a.href='#';a.className=category===c?'active':'';a.innerHTML=`${items[0].categoryEn} <span>${items.length}</span>`;a.onclick=e=>{e.preventDefault();category=c;render()};side.appendChild(a)});
   const list=document.getElementById('problem-list');list.innerHTML='';PROBLEMS.filter(p=>p.group===group&&(!category||p.Category===category)).forEach(p=>{const a=document.createElement('a');a.className='problem-row';a.href=`../problems/${encodeURIComponent(p.ID)}/index.html`;a.innerHTML=`<div class="problem-id">${p.ID}<small>${p.categoryEn}</small></div><div><h3>${p['Plain Language']}</h3><p>${p['Business Problem']}</p></div><div>→</div>`;list.appendChild(a)});
 }
 render();
})();
</script></body></html>
